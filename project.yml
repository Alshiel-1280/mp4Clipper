name: ClipBatcher
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: 13.0
    PRODUCT_BUNDLE_IDENTIFIER: com.alshiel.mp4Clipper
targets:
  ClipBatcher:
    type: application
    platform: macOS
    sources:
      - path: Sources/mp4Clipper
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: ClipBatcher
        CFBundleName: ClipBatcher
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: ClipBatcher
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
schemes:
  ClipBatcher:
    build:
      targets:
        ClipBatcher: all
    run:
      config: Debug
    archive:
      config: Release
